name: ai-style

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/ai_style_rules.py'
      - 'tests/**'
      - '.github/workflows/ai-style.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/ai_style_rules.py'
      - 'tests/**'
      - '.github/workflows/ai-style.yml'

permissions:
  contents: read

jobs:
  ai-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Detector self-test
        run: python3 tools/ai_style_rules.py --selftest
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Writing-style scan (report-only)
        run: python3 tools/ai_style_rules.py . --exclude '.venv/*'
