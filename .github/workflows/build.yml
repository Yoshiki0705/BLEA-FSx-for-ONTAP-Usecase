name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint "usecases/**/*.ts" "shared/**/*.ts" --max-warnings 50

      - name: Format check (prettier)
        run: npx prettier --check "usecases/**/*.ts" "shared/**/*.ts"

      - name: Check for hardcoded secrets or personal info
        # Generic rules only (account ID, host IP, email). Real values stay in the
        # gitignored .sensitive-patterns.private; see tools/check_sensitive.py.
        run: |
          python3 tools/check_sensitive.py --selftest
          python3 tools/check_sensitive.py

      - name: Test
        run: npm test

      - name: CDK Synth (Spec A)
        run: npx cdk synth --quiet
        working-directory: usecases/blea-guest-fsxn-data-analytics-sample

      - name: CDK Synth (Spec B)
        run: npx cdk synth --quiet
        working-directory: usecases/guest-fsxn-cyber-resilience-sample

      - name: CDK Synth (Spec G)
        run: npx cdk synth --quiet
        working-directory: usecases/blea-guest-fsxn-flexcache-sample

      - name: CDK Synth (Spec H)
        run: npx cdk synth --quiet
        working-directory: usecases/blea-guest-fsxn-modernization-sample
